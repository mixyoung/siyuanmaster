[workspace]
members = ["crates/core", "crates/siyuanmasterd", "crates/siyuanmaster"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"

[profile.release]
lto = true
strip = true
